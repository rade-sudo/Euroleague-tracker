<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0f" />
    <title>Nema interneta · Tiketi</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: radial-gradient(60% 420px at 50% 0%, rgba(255, 106, 19, 0.16), transparent), #0a0b0f;
        color: #d4d4d8;
        font: 15px/1.5 "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 22rem; }
      img { width: 72px; height: 72px; border-radius: 22.5%; box-shadow: 0 18px 40px -16px rgba(255, 106, 19, 0.7); }
      h1 { margin: 6px 0 0; font: 800 34px/1 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; text-transform: uppercase; color: #fafafa; }
      p { margin: 0; color: #8b8b95; }
      button {
        height: 44px;
        margin-top: 6px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #ff6a13;
        color: #0a0b0f;
        font: 700 15px "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 12px 30px -12px rgba(255, 106, 19, 0.7);
      }
      button:focus-visible { outline: 2px solid #ff6a13; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Nema interneta</h1>
      <p>Tiketi trebaju internet da bi pokazali tabelu i tikete. Provjeri vezu pa pokušaj ponovo.</p>
      <button type="button" onclick="location.reload()">Pokušaj ponovo</button>
    </main>
  </body>
</html>
